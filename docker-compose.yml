services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demofinder
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://demo:demo@db:5432/demofinder
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEV_MODE: ${DEV_MODE:-false}
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./web
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:

name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements.txt pytest
      - run: python -m pytest api/tests -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web

  dependabot-alerts:
    name: Dependabot Alerts
    runs-on: ubuntu-latest
    permissions:
      vulnerability-alerts: read
    steps:
      - name: Fail on open high or critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts="$(gh api --paginate \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&severity=high,critical&per_page=100" \
            --jq '.[] | "\(.security_advisory.severity | ascii_upcase): \(.dependency.package.name) - \(.security_advisory.summary) (\(.html_url))"')"

          if [[ -n "$alerts" ]]; then
            echo "::error title=Open Dependabot alerts::Resolve all high or critical Dependabot alerts."
            printf '%s\n' "$alerts"
            exit 1
          fi

          echo "No open high or critical Dependabot alerts."

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  request_changes_workflow: true
  pre_merge_checks:
    custom_checks:
      - name: "No Unresolved Security Findings"
        mode: "error"
        instructions: >
          Fail if CodeRabbit's review (including CodeRabbit Security analysis)
          has identified any security finding introduced by this pull request's
          diff that is not resolved or explicitly dismissed. This includes,
          but is not limited to: hardcoded credentials, API keys, tokens, or
          secrets; SQL/command/code injection risks; missing authentication or
          authorization checks (e.g. insecure direct object references);
          unsafe deserialization; path traversal; SSRF; XSS; use of known-
          vulnerable dependencies introduced by this change; and insecure
          cryptographic practices.

          Pass: No security findings were raised against the changed files in
          this PR, or all previously raised findings have been marked resolved
          or explicitly dismissed by a reviewer.

          Fail: One or more security findings remain open/unresolved against
          code changed in this PR.
